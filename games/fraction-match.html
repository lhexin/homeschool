<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza fraction match</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #12163A; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  h1 { color: #FFFFFF; font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: #9AA3D4; font-size: 14px; margin-bottom: 20px; }
  .pizza { width: 160px; height: 160px; border-radius: 50%; margin-bottom: 20px; border: 4px solid #FFD873; }
  .question { font-size: 17px; font-weight: 600; color: #D6DBFF; margin-bottom: 18px; text-align: center; }
  .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 340px; }
  .choice { min-height: 64px; font-size: 22px; font-weight: 700; color: #FFFFFF; background: #4E8CFF; border: none; border-radius: 16px; box-shadow: 0 4px 0 #2A5FD9; }
  .choice:active { transform: translateY(2px); box-shadow: 0 2px 0 #2A5FD9; }
  .hint { min-height: 22px; color: #FFD23F; font-weight: 600; margin-top: 16px; }
  .progress-dots { display: flex; gap: 6px; margin-top: 28px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3A4080; }
  .dot.done { background: #FFD23F; }
  .celebrate { text-align: center; color: #FFFFFF; }
  .celebrate .star { font-size: 64px; }
  .done-btn { margin-top: 24px; background: #FFD23F; color: #4A2A00; border: none; border-radius: 999px; padding: 14px 32px; font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
<div id="game"></div>
<script>
  const params = new URLSearchParams(window.location.search);
  const childId = params.get('childId') || '';
  const lessonId = params.get('lessonId') || 'fraction-match-1';
  const subject = params.get('subject') || 'maths';
  const saveKey = `progress:${childId}:${lessonId}`;
  const TOTAL = 6;
  const DENOMS = [2, 3, 4, 5, 6, 8];

  function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
  function simplify(n, d) { const g = gcd(n, d) || 1; return `${n / g}/${d / g}`; }

  let questions = DENOMS.map(d => ({ d, n: Math.max(1, Math.floor(Math.random() * (d - 1)) + 1) }));
  questions = questions.sort(() => Math.random() - 0.5).slice(0, TOTAL);

  let state = { index: 0, correct: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(saveKey) || 'null');
    if (saved && typeof saved.index === 'number') state = saved;
  } catch (e) {}

  function save() { localStorage.setItem(saveKey, JSON.stringify(state)); }
  setInterval(save, 5000);

  function pizzaGradient(n, d) {
    const stops = [];
    const sliceDeg = 360 / d;
    for (let i = 0; i < d; i++) {
      const color = i < n ? '#FF6B4A' : '#FFE7B8';
      stops.push(`${color} ${i * sliceDeg}deg ${(i + 1) * sliceDeg}deg`);
    }
    return `conic-gradient(${stops.join(',')})`;
  }

  function render() {
    const game = document.getElementById('game');
    if (state.index >= TOTAL) {
      localStorage.removeItem(saveKey);
      game.innerHTML = `
        <div class="celebrate">
          <div class="star">⭐</div>
          <h1>Fraction fan!</h1>
          <div class="sub">You matched ${TOTAL} pizza fractions</div>
          <button class="done-btn" id="doneBtn">Done</button>
        </div>
      `;
      document.getElementById('doneBtn').addEventListener('click', finish);
      return;
    }
    const q = questions[state.index];
    const answer = simplify(q.n, q.d);
    const correctLabel = `${q.n}/${q.d}`;
    const choices = new Set([correctLabel]);
    // Try same-denominator distractors first (varying the numerator), but a
    // denominator of 2 only has one valid numerator, so this can never reach
    // 4 options alone — cap the attempts and fall back to a fixed pool of
    // common fractions so the loop can never spin forever.
    let attempts = 0;
    while (choices.size < 4 && attempts < 20) {
      const wn = Math.max(1, Math.min(q.d - 1, q.n + Math.floor(Math.random() * 3) - 1));
      choices.add(`${wn}/${q.d}`);
      attempts++;
    }
    const fallbackPool = ['1/2', '1/3', '2/3', '1/4', '3/4', '1/5', '2/5', '3/5', '4/5', '1/6', '5/6', '1/8', '3/8', '5/8', '7/8'];
    let fallbackIdx = 0;
    while (choices.size < 4 && fallbackIdx < fallbackPool.length) {
      choices.add(fallbackPool[fallbackIdx]);
      fallbackIdx++;
    }
    const shuffled = Array.from(choices).sort(() => Math.random() - 0.5);

    let dots = '';
    for (let i = 0; i < TOTAL; i++) dots += `<div class="dot ${i < state.index ? 'done' : ''}"></div>`;

    game.innerHTML = `
      <h1>Pizza fraction match</h1>
      <div class="sub">Question ${state.index + 1} of ${TOTAL}</div>
      <div class="pizza" style="background:${pizzaGradient(q.n, q.d)}"></div>
      <div class="question">What fraction of the pizza is shaded?</div>
      <div class="choices">${shuffled.map(c => `<button class="choice" data-val="${c}">${c}</button>`).join('')}</div>
      <div class="hint" id="hint"></div>
      <div class="progress-dots">${dots}</div>
    `;
    document.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.val === `${q.n}/${q.d}`) {
          state.index++;
          state.correct++;
          save();
          render();
        } else {
          document.getElementById('hint').textContent = 'Try again!';
        }
      });
    });
  }

  function finish() {
    const payload = { type: 'activityComplete', id: lessonId, childId, subject, score: state.correct };
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(payload, '*');
    } else {
      localStorage.setItem('fs:pendingComplete', JSON.stringify({ id: lessonId, childId, subject }));
      window.location.href = `../index.html#/kid/${childId}`;
    }
  }

  render();
</script>
</body>
</html>
